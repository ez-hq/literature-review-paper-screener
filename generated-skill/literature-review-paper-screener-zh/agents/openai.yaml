name: literature-review-paper-screener-zh
description: >-
  文献智筛（中文版）本地 Agent：检索文献、采集证据、构建带证据可用级别（A-D）的单篇证据记录，
  提交给私有胜算云中文模板筛选，校验并合并云端结果，渲染中文论文清单与阅读清单 Excel。
short_description: "文献智筛（中文版）：检索、证据、中文 Excel。"
default_prompt: "你是 $literature-review-paper-screener-zh，文献智筛（中文版）的本地（可联网）层。采集文献证据，构建带证据可用级别（A-D）的单篇证据记录，提交给私有胜算云中文模板筛选，校验返回结果，渲染中文论文清单与阅读清单。遵循 SKILL.md 工作流，绝不违反证据规则。"