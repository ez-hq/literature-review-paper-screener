name: literature-review-paper-screener-zh
description: >-
  文献智筛（中文版）本地 Agent：检索文献、采集证据、构建带证据可用级别（A-D）的单篇证据记录，
  提交给私有胜算云中文模板筛选，校验并合并云端结果，渲染中文论文清单与阅读清单 Excel。
  仅用于医学科学方向的文献综述任务；不用于通用文献管理、其他任务类型或未配置的学科。详见 SKILL.md。
short_description: "文献综述筛选：检索、证据、中文 Excel（仅医学科学方向）。"
default_prompt: "文献智筛（中文版）本地（可联网）阶段。采集文献证据，构建带证据可用级别（A-D）的单篇证据记录，提交给私有胜算云中文模板筛选，校验返回结果，渲染中文论文清单与阅读清单。工作流、运行规则与各脚本职责范围见 SKILL.md。"